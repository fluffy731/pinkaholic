<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Thank you | Pinkaholic</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="doc" style="text-align:center">
    <img src="assets/logo.svg" alt="Pinkaholic" width="220" height="55" style="margin:0 auto 28px">
    <h1>Thank you, <em>pink friend.</em></h1>
    <p class="lede" style="margin-inline:auto">Your order is in. You'll get a receipt by email now, and a tracking link once your balls are printed and on their way. Most orders arrive in about 14 days.</p>
    <p id="your-text" hidden></p>
    <a class="btn" href="./">Back to Pinkaholic</a>
  </main>
  <script>
    // After a paid Stripe checkout: show what was ordered, then empty the bag.
    (function () {
      try {
        var params = new URLSearchParams(location.search);
        var bag = JSON.parse(localStorage.getItem("pinkaholic-bag") || "[]");
        var p = document.getElementById("your-text");
        if (bag.length) {
          var words = bag.map(function (it) {
            return [it.line1, it.line2].filter(Boolean).join(" / ") || "your logo";
          });
          p.textContent = (params.get("order") ? "Order " + params.get("order") + ": " : "") +
            words.map(function (w) { return "“" + w + "”"; }).join(", ") +
            ". Spotted a typo? Reply to your receipt email within 24 hours and we'll fix it before printing.";
          p.className = "order__soon";
          p.style.margin = "0 auto 28px";
          p.style.maxWidth = "34em";
          p.hidden = false;
        }
        if (params.get("session_id")) localStorage.removeItem("pinkaholic-bag");
      } catch (e) {}
    })();
  </script>
</body>
</html>
